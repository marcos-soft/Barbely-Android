name: Generar APK de Barbely

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto Android
        run: |
          unzip -q Barbely_Android_Studio.zip -d proyecto
          find proyecto -name gradlew -type f

      - name: Compilar APK
        run: |
          chmod +x proyecto/Barbely-Android/gradlew
          proyecto/Barbely-Android/gradlew -p proyecto/Barbely-Android assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Barbely-APK
          path: proyecto/Barbely-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
